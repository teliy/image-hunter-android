# JVM для Gradle: Android-сборке хватает 2 ГБ
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX обязателен
android.useAndroidX=true
# Kotlin 2.x: генерация и проверка Stubs в один проход (быстрее сборка)
kotlin.incremental=true
# Имена ресурсов не сжимаем (strings.xml читается в рантайме)
android.nonTransitiveRClass=true
